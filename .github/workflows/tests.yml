name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          test_output="$(python -m unittest -v 2>&1)"
          test_status=$?
          set -e

          printf '%s\n' "$test_output"
          {
            printf '## Unit test output\n\n'
            printf '```text\n%s\n```\n' "$test_output"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$test_status"
